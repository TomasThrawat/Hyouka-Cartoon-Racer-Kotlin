name: Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure Git
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: hyouka-cartoon-racer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: Nexus 6
          cores: 4
          ram-size: 4096M
          heap-size: 768M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            set -eux

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c

            adb shell am force-stop com.tomasthrawat.hyoukacartoonracer.debug
            adb shell am start -n com.tomasthrawat.hyoukacartoonracer.debug/.MainActivity
            sleep 4

            adb shell pidof com.tomasthrawat.hyoukacartoonracer.debug
            adb shell dumpsys activity activities | grep -F 'com.tomasthrawat.hyoukacartoonracer.debug/.MainActivity'

            adb exec-out screencap -p > smoke-menu.png

            SIZE=$(adb shell wm size | grep -oE '[0-9]+x[0-9]+' | tail -1); W=\${SIZE%x*}; H=\${SIZE#*x}; if [ "$W" -lt "$H" ]; then T=$W; W=$H; H=$T; fi; adb shell input tap $((W / 2)) $((H * 56 / 100))
            sleep 1
            adb exec-out screencap -p > smoke-howto.png

            SIZE=$(adb shell wm size | grep -oE '[0-9]+x[0-9]+' | tail -1); W=\${SIZE%x*}; H=\${SIZE#*x}; if [ "$W" -lt "$H" ]; then T=$W; W=$H; H=$T; fi; adb shell input tap $((W / 2)) $((H * 85 / 100))
            sleep 1

            SIZE=$(adb shell wm size | grep -oE '[0-9]+x[0-9]+' | tail -1); W=\${SIZE%x*}; H=\${SIZE#*x}; if [ "$W" -lt "$H" ]; then T=$W; W=$H; H=$T; fi; adb shell input tap $((W / 2)) $((H * 43 / 100))
            sleep 4
            adb exec-out screencap -p > smoke-race-start.png

            SIZE=$(adb shell wm size | grep -oE '[0-9]+x[0-9]+' | tail -1); W=\${SIZE%x*}; H=\${SIZE#*x}; if [ "$W" -lt "$H" ]; then T=$W; W=$H; H=$T; fi; S=$((H * 20 / 100)); Y=$((H - 28 - S / 2)); X=$((28 + S / 2)); adb shell input tap "$X" "$Y"
            sleep 0.5

            SIZE=$(adb shell wm size | grep -oE '[0-9]+x[0-9]+' | tail -1); W=\${SIZE%x*}; H=\${SIZE#*x}; if [ "$W" -lt "$H" ]; then T=$W; W=$H; H=$T; fi; S=$((H * 20 / 100)); Y=$((H - 28 - S / 2)); X=$((44 + S + S / 2)); adb shell input tap "$X" "$Y"
            sleep 0.5

            SIZE=$(adb shell wm size | grep -oE '[0-9]+x[0-9]+' | tail -1); W=\${SIZE%x*}; H=\${SIZE#*x}; if [ "$W" -lt "$H" ]; then T=$W; W=$H; H=$T; fi; S=$((H * 20 / 100)); Y=$((H - 28 - S / 2)); X=$((W - 42 - (S * 118 / 100) / 2)); adb shell input tap "$X" "$Y"
            sleep 1
            adb exec-out screencap -p > smoke-race-controls.png

            adb shell logcat -d -t 1500 > smoke-logcat.txt

            grep -q 'MENU=HOW_TO' smoke-logcat.txt
            grep -q 'HOW_TO=BACK' smoke-logcat.txt
            grep -q 'MENU=PLAY' smoke-logcat.txt
            grep -q 'STATE=COUNTDOWN' smoke-logcat.txt
            grep -q 'STATE=RACING' smoke-logcat.txt
            grep -q 'CONTROL=LEFT' smoke-logcat.txt
            grep -q 'CONTROL=RIGHT' smoke-logcat.txt
            grep -q 'CONTROL=BOOST' smoke-logcat.txt
            ! grep -E 'FATAL EXCEPTION|ANR in |AndroidRuntime' smoke-logcat.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hyouka-cartoon-racer-smoke-test
          path: |
            smoke-menu.png
            smoke-howto.png
            smoke-race-start.png
            smoke-race-controls.png
            smoke-logcat.txt
          if-no-files-found: error
          retention-days: 30
