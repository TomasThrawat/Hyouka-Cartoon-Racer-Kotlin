name: Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure Git
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          check-latest: false

      - name: Validate Python CI verifier
        run: python -m py_compile ci/verify_build.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee test.log

      - name: Verify APK and logs with Python
        run: |
          python ci/verify_build.py \
            --build-log build.log \
            --test-log test.log \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --report ci-build-report.json

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: hyouka-cartoon-racer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Android emulator environment
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb1 libx11-xcb-dev
          rm -f "$HOME/.android/emu-update-last-check.ini"

      - name: Android emulator smoke test
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          heap-size: 768M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none -no-metrics -no-snapshot
          disable-animations: true
          script: bash ci/android_smoke.sh

      - name: Verify smoke test with Python
        if: always()
        run: |
          python ci/verify_build.py \
            --build-log build.log \
            --test-log test.log \
            --smoke-log smoke-logcat.txt \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --report ci-build-report-final.json

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hyouka-cartoon-racer-smoke-test
          path: |
            smoke-menu.png
            smoke-howto.png
            smoke-race-start.png
            smoke-race-controls.png
            smoke-logcat.txt
            smoke-activity.txt
            smoke-windows.txt
            ci-build-report.json
            ci-build-report-final.json
          if-no-files-found: ignore
          retention-days: 30
