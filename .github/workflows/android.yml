name: Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure Git
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          check-latest: false

      - name: Validate Python CI verifier
        run: python -m py_compile ci/verify_build.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee test.log

      - name: Verify APK and logs with Python
        run: |
          python ci/verify_build.py \
            --build-log build.log \
            --test-log test.log \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --report ci-build-report.json

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: hyouka-cartoon-racer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Android emulator environment
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb1 libx11-xcb-dev
          rm -f "$HOME/.android/emu-update-last-check.ini"

      - name: Android emulator smoke test
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          heap-size: 768M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none -no-metrics -no-snapshot
          disable-animations: true
          script: |
            set -eux

            PKG=com.tomasthrawat.hyoukacartoonracer.debug
            ACTIVITY=com.tomasthrawat.hyoukacartoonracer.MainActivity
            COMPONENT="$PKG/$ACTIVITY"

            dump_diagnostics() {
              timeout 15s adb logcat -d -t 2000 > smoke-logcat.txt 2>&1 || true
              timeout 15s adb shell dumpsys activity activities > smoke-activity.txt 2>&1 || true
              timeout 15s adb shell dumpsys window windows > smoke-windows.txt 2>&1 || true
            }
            trap dump_diagnostics EXIT

            timeout 45s adb wait-for-device
            timeout 30s adb shell getprop sys.boot_completed | grep -Fx "1"

            timeout 60s adb install -r app/build/outputs/apk/debug/app-debug.apk
            timeout 30s adb logcat -c

            timeout 30s adb shell cmd package resolve-activity --brief "$PKG" | tail -1 | grep -Fx "$COMPONENT"
            timeout 30s adb shell am force-stop "$PKG"
            timeout 30s adb shell am start -W -n "$COMPONENT"
            sleep 4

            timeout 30s adb shell pidof "$PKG"
            timeout 30s adb shell dumpsys activity activities | grep -F "$COMPONENT"

            timeout 30s adb exec-out screencap -p > smoke-menu.png

            SIZE=$(timeout 30s adb shell wm size | grep -oE '[0-9]+x[0-9]+' | tail -1)
            W=\${SIZE%x*}
            H=\${SIZE#*x}
            if [ "$W" -lt "$H" ]; then T=$W; W=$H; H=$T; fi

            timeout 30s adb shell input tap $((W / 2)) $((H * 56 / 100))
            sleep 1
            timeout 30s adb exec-out screencap -p > smoke-howto.png

            timeout 30s adb shell input tap $((W / 2)) $((H * 85 / 100))
            sleep 1

            timeout 30s adb shell input tap $((W / 2)) $((H * 43 / 100))
            sleep 4
            timeout 30s adb exec-out screencap -p > smoke-race-start.png

            S=$((H * 20 / 100))
            Y=$((H - 28 - S / 2))
            X=$((28 + S / 2))
            timeout 30s adb shell input tap "$X" "$Y"
            sleep 0.5

            X=$((44 + S + S / 2))
            timeout 30s adb shell input tap "$X" "$Y"
            sleep 0.5

            X=$((W - 42 - (S * 118 / 100) / 2))
            timeout 30s adb shell input tap "$X" "$Y"
            sleep 1
            timeout 30s adb exec-out screencap -p > smoke-race-controls.png

            timeout 30s adb shell logcat -d -t 1500 > smoke-logcat.txt

            grep -q 'MENU=HOW_TO' smoke-logcat.txt
            grep -q 'HOW_TO=BACK' smoke-logcat.txt
            grep -q 'MENU=PLAY' smoke-logcat.txt
            grep -q 'STATE=COUNTDOWN' smoke-logcat.txt
            grep -q 'STATE=RACING' smoke-logcat.txt
            grep -q 'CONTROL=LEFT' smoke-logcat.txt
            grep -q 'CONTROL=RIGHT' smoke-logcat.txt
            grep -q 'CONTROL=BOOST' smoke-logcat.txt
            ! grep -E 'FATAL EXCEPTION|ANR in |AndroidRuntime' smoke-logcat.txt

      - name: Verify smoke test with Python
        if: always()
        run: |
          python ci/verify_build.py \
            --build-log build.log \
            --test-log test.log \
            --smoke-log smoke-logcat.txt \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --report ci-build-report-final.json

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hyouka-cartoon-racer-smoke-test
          path: |
            smoke-menu.png
            smoke-howto.png
            smoke-race-start.png
            smoke-race-controls.png
            smoke-logcat.txt
            smoke-activity.txt
            smoke-windows.txt
            ci-build-report.json
            ci-build-report-final.json
          if-no-files-found: ignore
          retention-days: 30
